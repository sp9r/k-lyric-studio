<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>K-Lyric Studio</title>
  <link rel="stylesheet" href="ui.css" />
</head>
<body class="kls-popup-body">
  <header class="kls-head">
    <div class="kls-brand">
      <img src="icons/icon.svg" alt="" />
      <span>K-Lyric Studio</span>
    </div>
    <button id="btn-enabled" type="button" class="kls-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path><line x1="12" y1="2" x2="12" y2="12"></line></svg>
      <span id="lbl-enabled">動作中</span>
    </button>
  </header>

  <section class="kls-section">
    <h2 class="kls-title">読み方ガイド表示</h2>
    <div id="reading-modes" class="kls-seg"></div>
  </section>

  <section class="kls-section">
    <div class="kls-row" style="margin-bottom:6px;">
      <span class="kls-title" style="margin:0;">単語帳・復習状況</span>
      <span id="popup-stats-text" class="kls-muted">0枚</span>
    </div>
    <div class="kls-progress-track">
      <div id="bar-mastered" style="width:0%;background:var(--ui-success);"></div>
      <div id="bar-learning" style="width:0%;background:var(--ui-accent);"></div>
      <div id="bar-seen" style="width:0%;background:var(--ui-unseen);"></div>
    </div>
    <div id="popup-freq-stats" class="kls-muted kls-popup-freq kls-hidden"></div>
  </section>

  <section class="kls-section kls-row">
    <div class="kls-seg">
      <button id="btn-open-studio" type="button" class="kls-btn is-primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="M7 10h10"></path><path d="M7 14h6"></path></svg>
        <span>復習スタジオを開く</span>
      </button>
      <button id="btn-open-freq" type="button" class="kls-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
        <span>頻出単語帳を開く</span>
      </button>
    </div>
    <button id="btn-open-options" type="button" class="kls-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.77 1 1.51 1H21a2 2 0 1 1 0 4h-.09c-.74 0-1.25.4-1.51 1z"></path></svg>
      <span>設定</span>
    </button>
  </section>

  <script src="lib/srs.js"></script>
  <script src="popup.js"></script>
</body>
</html>
