<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ILLIT - Magnetic (Official MV) - YouTube</title>
  <link rel="stylesheet" href="/content.css" />
  <style>
    body {
      margin: 0;
      padding: 16px;
      background: #f9f9f9;
      color: #0f0f0f;
      font-family: Inter, "Noto Sans JP", "Noto Sans KR", sans-serif;
    }
    .yt-shell {
      max-width: 1220px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 390px;
      gap: 18px;
      align-items: start;
    }
    #movie_player {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #14171c;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #2c313a;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .mock-stage-top {
      padding: 14px 18px;
      color: #c8cfd8;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.45), transparent);
    }
    .mock-stage-bar {
      padding: 10px 16px;
      color: #d8dee6;
      font-size: 12px;
      background: rgba(0, 0, 0, 0.55);
      display: flex;
      justify-content: space-between;
    }
    video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      pointer-events: none;
    }
    .yt-meta {
      margin-top: 12px;
      padding: 10px 4px;
    }
    .yt-meta h1 {
      margin: 0 0 4px;
      font-size: 18px;
    }
    .yt-meta .ch {
      font-size: 13px;
      color: #606060;
    }
    .mock-related {
      display: grid;
      gap: 10px;
      margin-top: 12px;
    }
    .mock-rel-card {
      display: grid;
      grid-template-columns: 140px minmax(0, 1fr);
      gap: 10px;
      padding: 8px;
      background: #fff;
      border: 1px solid #dfe2e6;
      border-radius: 8px;
      align-items: center;
    }
    .mock-rel-thumb {
      position: relative;
      display: block;
      width: 140px;
      aspect-ratio: 16 / 9;
      background: #1d222b;
      border-radius: 6px;
      overflow: hidden;
    }
    .mock-rel-thumb a {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      color: #cfd5dd;
      font-size: 11px;
      text-decoration: none;
    }
    .mock-rel-title {
      font-size: 13px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="yt-shell">
    <div>
      <div id="movie_player">
        <video id="mock-video"></video>
        <div class="mock-stage-top">
          <span>YouTube Watch Mock Player</span>
          <span id="mock-time-readout">0:42 / 2:41</span>
        </div>
        <div class="mock-stage-bar">
          <span>再生位置 0:42</span>
          <span>1080p HD</span>
        </div>
      </div>
      <div class="yt-meta">
        <h1>ILLIT - Magnetic (Official MV)</h1>
        <div class="ch">HYBE LABELS</div>
      </div>
    </div>
    <div>
      <div id="secondary-inner"></div>
      <div class="mock-related">
        <div class="mock-rel-card kls-mock-card">
          <yt-thumbnail-view-model class="mock-rel-thumb">
            <a href="https://www.youtube.com/watch?v=quick_new_1">Thumbnail 1</a>
          </yt-thumbnail-view-model>
          <div>
            <div class="mock-rel-title" data-kls-title>ILLIT Vlog 単語テスト</div>
            <div class="ch" style="font-size:11px;color:#606060;">ILLIT</div>
          </div>
        </div>
        <div class="mock-rel-card kls-mock-card">
          <ytd-thumbnail class="mock-rel-thumb">
            <a href="https://www.youtube.com/watch?v=quick_done_1">Thumbnail 2</a>
          </ytd-thumbnail>
          <div>
            <div class="mock-rel-title" data-kls-title>ILLIT 記録済みテスト</div>
            <div class="ch" style="font-size:11px;color:#606060;">ILLIT</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    window.__KLS_MANUAL_INIT__ = true;
    window.__KLS_ALLOW_QUICK_SCAN__ = true;
    window.__KLS_QUICK_CALLS__ = [];
    window.__KLS_QUICK_FETCH__ = async (videoId, fallbackMeta) => {
      window.__KLS_QUICK_CALLS__.push(videoId);
      return {
        meta: {
          isMusic: false,
          videoId,
          title: (fallbackMeta && fallbackMeta.title) || "ILLIT Vlog 単語テスト",
          author: "ILLIT"
        },
        cues: [
          { id: 0, start: 4, end: 8, ko: "안녕하세요 오늘 정말 반가워요", ja: "こんにちは今日とても嬉しいです" },
          { id: 1, start: 12, end: 16, ko: "연습 열심히 하고 있어요", ja: "練習を頑張っています" }
        ]
      };
    };
    if (!localStorage.getItem("kls:vocabLog")) {
      localStorage.setItem("kls:vocabLog", JSON.stringify({
        version: 1,
        videos: {
          "quick_done_1": {
            videoId: "quick_done_1",
            title: "ILLIT 記録済みテスト",
            site: "youtube",
            recordedAt: 1000,
            uniqueWords: 2,
            wordKeys: ["오늘", "연습"],
            wordCounts: { "오늘": 1, "연습": 1 }
          }
        },
        words: {
          "오늘": {
            key: "오늘", lemma: "오늘", surfaceSample: "오늘", meaning: "今日", pos: "名詞",
            videoCount: 1, totalCount: 1, lastSeenAt: 1000,
            occurrences: [{ videoId: "quick_done_1", title: "ILLIT 記録済みテスト", isMusic: false, sec: 10, url: "https://www.youtube.com/watch?v=quick_done_1&t=10s", surface: "오늘", context: "오늘 연습" }]
          },
          "연습": {
            key: "연습", lemma: "연습", surfaceSample: "연습", meaning: "練習", pos: "名詞",
            videoCount: 1, totalCount: 1, lastSeenAt: 1000,
            occurrences: [{ videoId: "quick_done_1", title: "ILLIT 記録済みテスト", isMusic: false, sec: 10, url: "https://www.youtube.com/watch?v=quick_done_1&t=10s", surface: "연습", context: "오늘 연습" }]
          }
        }
      }));
    }
    // Stub HTMLMediaElement time & playback state cleanly without requiring a media file
    const v = document.getElementById("mock-video");
    let fakeTime = 42.5;
    let fakePaused = false;
    let fakeRate = 1.0;
    Object.defineProperty(v, "currentTime", {
      get: () => fakeTime,
      set: (val) => {
        fakeTime = Number(val) || 0;
        document.getElementById("mock-time-readout").textContent =
          Math.floor(fakeTime / 60) + ":" + String(Math.floor(fakeTime % 60)).padStart(2, "0") + " / 2:41";
      }
    });
    Object.defineProperty(v, "duration", { get: () => 161 });
    Object.defineProperty(v, "paused", { get: () => fakePaused });
    Object.defineProperty(v, "playbackRate", {
      get: () => fakeRate,
      set: (val) => { fakeRate = Number(val) || 1.0; }
    });
    v.play = () => { fakePaused = false; return Promise.resolve(); };
    v.pause = () => { fakePaused = true; };
  </script>
  <script src="/lib/hangul.js"></script>
  <script src="/lib/hanja_readings.js"></script>
  <script src="/lib/hanja.js"></script>
  <script src="/lib/aligned.js"></script>
  <script src="/lib/dictionary.js"></script>
  <script src="/lib/srs.js"></script>
  <script src="/lib/activation.js"></script>
  <script src="/lib/vocab_log.js"></script>
  <script src="/content.js"></script>
  <script>
    window.KLyricContent.init({
      isMusic: false,
      url: "https://www.youtube.com/watch?v=Vk5-c_v4gMU",
      videoId: "Vk5-c_v4gMU",
      title: "ILLIT - Magnetic (Official MV)",
      author: "HYBE LABELS",
      captionTracks: []
    }).then(() => {
      window.KLyricContent.loadCuesForTest(
        [
          { id: 0, start: 38, end: 41.5, ko: "이번엔 정말 좋아해", ja: "今度は本当に好きだよ" },
          { id: 1, start: 42, end: 46.5, ko: "내 맘이 너한테 설레잖아", ja: "私の心が君にときめくじゃない" },
          { id: 2, start: 47, end: 52, ko: "우리 같이 있으면 어떡해", ja: "私たちが一緒にいたらどうしよう" },
          { id: 3, start: 75, end: 80, ko: "오늘 연습 진짜 힘들었어", ja: "今日の練習、本当に大変だった" }
        ],
        "LRCLIB 同期歌詞"
      );
    });
  </script>
</body>
</html>
